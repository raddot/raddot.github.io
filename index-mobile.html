    .photo-nav-container {
      position: relative;

    .photo-nav-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50% / 50%;
      display: block;
    }

    .nav-around {
      position: absolute;
      top: 50%;
      left: -120px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .nav-around a {
      text-decoration: none;
      color: #000;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 0.5px;
      font-size: 1rem;
      margin-bottom: 10px;
      transition: background 0.3s ease;
    }
    .nav-around a:hover {
      background: rgba(255, 255, 255, 0.7);
    }

<style>
/* One-screen mobile hero: start from top, no vertical centering gap; tighter vertical rhythm */
/*
  Background note: the gradient is painted ON TOP of the JPG (first layer = top).
  Using ~0.95 alpha washed out mobile.jpg; ~0.35 keeps a light tint so the pattern stays visible.
*/
body.mobile-home {
  min-height: 100dvh;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 0;
  padding-left: max(env(safe-area-inset-left), 0px);
  padding-right: max(env(safe-area-inset-right), 0px);
  padding-top: max(env(safe-area-inset-top), 4px);
  padding-bottom: max(env(safe-area-inset-bottom), 6px);
  box-sizing: border-box;
  background-image:
    linear-gradient(135deg, rgba(255,245,242,0.38), rgba(255,227,220,0.32)),
    url('assets/img/mobile.jpg');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: scroll;
}

/* Mobile-first hero composition: tighter and centered */
/* Kill inherited flex:1 on .intro from head — it was eating vertical space and leaving a gap above the photo */
body.mobile-home .container {
  width: min(94vw, 380px);
  margin: 0 auto;
  padding: 4px 10px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start !important;
  gap: 0;
  flex: 0 1 auto;
  min-height: 0;
}

body.mobile-home .intro {
  flex: 0 0 auto !important;
  max-width: 100%;
  padding-right: 0;
  margin-bottom: 0 !important;
  text-align: center;
}

.intro h1 {
  font-size: clamp(2.15rem, 9.5vw, 2.85rem);
  line-height: 1.05;
  margin: 0 0 2px;
  padding-top: 0;
}

.intro h2 {
  font-size: clamp(0.92rem, 3.8vw, 1.1rem);
  line-height: 1.2;
  margin: 0;
}

body.mobile-home .photo-nav-container {
  width: min(52vw, 200px);
  height: auto;
  min-height: 0;
  margin: 6px auto 0;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Base .nav-around uses top:50%; mobile switches to relative but top was never reset — that offset entire nav below the photo */
body.mobile-home .photo-nav-container .nav-around {
  position: relative !important;
  top: auto !important;
  left: auto !important;
  right: auto !important;
  bottom: auto !important;
  transform: none !important;
  margin-top: 8px;
  width: 100%;
}

body.mobile-home .photo-nav-container img {
  width: 100%;
  height: min(66vw, 255px);
  object-fit: cover;
  border-radius: 50% / 50%;
  display: block;
}

body.mobile-home .intro center {
  display: block;
  margin: 4px 0 0;
  line-height: 1;
}
</style>

<script>
(function () {
  function removeQrNodes() {
    var el = document.getElementById('qr');
    if (el) el.remove();
    document.querySelectorAll('.qr-top-right').forEach(function (node) {
      node.remove();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', removeQrNodes);
  } else {
    removeQrNodes();
  }
})();
</script>
